name: Update TFD Market Prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price scraper
        run: node scraper.js

      - name: Commit and push updated prices
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TFD prices" && git push)
